[workspace]
members = ["crates/diir-core", "crates/diir-app"]
default-members = ["crates/diir-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
diir-core = { path = "crates/diir-core" }
# Pin the published API; do not track Zed's moving main branch.
gpui = "=0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
